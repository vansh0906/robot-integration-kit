# Example partner profile (fictional): an outdoor yard tug with car-like steering.
partner: "Partner B (example): yard tug, Ackermann steering"
platform:
  type: ackermann
  wheel_radius: 0.20
  wheel_base: 1.20
  max_steer_deg: 32
  max_steer_rate_deg: 60
  max_wheel_speed: 12.0
  max_wheel_accel: 6.0
  max_speed: 2.0
  max_yaw_rate: 1.0
  decel: 1.0
  footprint: {length: 1.80, width: 1.00}
sensors:
  lidar: {x: 0.85, y: 0.0, range: 20.0, fov_deg: 270, beams: 271, noise: 0.03, rate: 10}
  imu: {gyro_noise: 0.004, gyro_bias: 0.003}
  encoders: {noise: 0.015}
navigation:
  inflation: 0.30                # was 0.25 (lint CFG034)
  lookahead: 1.2
  goal_tolerance: 0.30
  stop_margin: 0.6
sites: [yard_loop]
conditions: [nominal, low_friction, popup_obstacle, estop, cmd_loss]
acceptance:
  mission_success_rate: 0.95
  position_error_p95: 0.15
  min_clearance: 0.20
  estop_stop_distance: 2.50
  watchdog_stop_time: 2.50
  popup_min_gap: 0.40
  missions_per_site: 10
